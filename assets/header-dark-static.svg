<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title">
  <title id="title">Dung Le — Team Lead, Fullstack Developer</title>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#4ADE80"/>
    </pattern>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#000000"/>
      <stop offset="0.75" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1000" height="250" fill="url(#edge)"/>
    </mask>

    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="sheen">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>


  <rect class="dots" width="1000" height="250" fill="url(#dots)" opacity="0.36" mask="url(#fade)"/>

  <text x="500" y="124" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2.4" fill="#F3F4F6">DUNG LE</text>

  <rect x="252" y="149" width="216" height="1" fill="url(#wingL)"/>
  <rect x="532" y="149" width="216" height="1" fill="url(#wingR)"/>
  <rect class="bar" x="468" y="148" width="64" height="4" rx="2" fill="#4ADE80"/>

  <text x="500" y="194" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="6.2" fill="#9CA3AF">TEAM LEAD · FULLSTACK DEVELOPER</text>
</svg>
