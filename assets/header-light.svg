<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title">
  <title id="title">Dung Le — Team Lead, Fullstack Developer</title>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#22C55E"/>
    </pattern>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#000000"/>
      <stop offset="0.75" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1000" height="250" fill="url(#edge)"/>
    </mask>

    <linearGradient id="wingL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes breathe { 0%, 100% { opacity: 0.26 } 50% { opacity: 0.54 } }
    @keyframes draw { from { transform: scaleX(0) } to { transform: scaleX(1) } }

    .dots { animation: breathe 6s ease-in-out infinite }
    .bar  { transform-box: fill-box; transform-origin: center;
            animation: draw 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) }

    @media (prefers-reduced-motion: reduce) {
      .dots, .bar { animation: none }
    }
  </style>

  <rect class="dots" width="1000" height="250" fill="url(#dots)" opacity="0.30" mask="url(#fade)"/>

  <text x="500" y="124" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2.4" fill="#111827">DUNG LE</text>

  <rect x="252" y="149" width="216" height="1" fill="url(#wingL)"/>
  <rect x="532" y="149" width="216" height="1" fill="url(#wingR)"/>
  <rect class="bar" x="468" y="148" width="64" height="4" rx="2" fill="#22C55E"/>

  <text x="500" y="194" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="6.2" fill="#6B7280">TEAM LEAD · FULLSTACK DEVELOPER</text>
</svg>
